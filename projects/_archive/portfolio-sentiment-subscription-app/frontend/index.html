<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio Sentiment MVP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Oyama Portfolio Intelligence</p>
        <h1>Portfolio Sentiment Dashboard</h1>
        <p class="subtitle">Sample-data MVP using legacy market/news work as the base. No real credentials required.</p>
      </div>
      <div class="score-card">
        <span>Overall sentiment</span>
        <strong id="overallScore">--</strong>
        <em id="overallLabel">loading</em>
      </div>
    </section>

    <section class="meta" id="configPanel"></section>
    <section class="grid" id="watchlist"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
