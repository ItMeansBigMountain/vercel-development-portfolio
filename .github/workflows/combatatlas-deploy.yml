name: CombatAtlas production deploy

on:
  push:
    branches: [main]
    paths:
      - 'projects/CombatAtlas/**'
      - '.github/workflows/combatatlas-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combatatlas-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: combatatlas-production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: projects/CombatAtlas
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/CombatAtlas/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Pull production configuration
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build with Vercel
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          case "$url" in https://*) ;; *) echo 'Vercel did not return a deployment URL' >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployment
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}" >/dev/null
