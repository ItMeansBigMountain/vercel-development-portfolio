name: Coding School CI Quality Gates

on:
  pull_request:
    paths: ['projects/coding-school-platform/**', '.github/workflows/coding-school-*.yml']
  push:
    branches: [main, coding-school]
    paths: ['projects/coding-school-platform/**', '.github/workflows/coding-school-*.yml']
  workflow_dispatch:

concurrency:
  group: coding-school-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: projects/coding-school-platform/app}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Run configured lint and format checks
        run: |
          if npm pkg get scripts.lint | grep -vq '^{}$'; then npm run lint; else echo 'No lint script configured'; fi
          if npm pkg get scripts.format:check | grep -vq '^{}$'; then npm run format:check; else echo 'No format:check script configured'; fi

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: projects/coding-school-platform/app}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  domain:
    name: Curriculum & Role Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: projects/coding-school-platform}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13'}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q coding_school examples tests

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LOG_OPTS: -- projects/coding-school-platform .github/workflows/coding-school-ci-quality-gates.yml .github/workflows/coding-school-vercel-preview.yml .github/workflows/coding-school-release.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - working-directory: projects/coding-school-platform/app
        run: npm ci --ignore-scripts
      - working-directory: projects/coding-school-platform/app
        run: npm audit --audit-level=high

  web-build-and-test:
    name: Web Build + Smoke + Input Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: {run: {working-directory: projects/coding-school-platform/app}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:web
      - run: npm run gate:inputs
      - run: npm run assert:provenance
      - name: Write immutable source manifest
        env:
          BUILD_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact-files.sha256
          node ops/write-release-manifest.mjs
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coding-school-web
          path: |
            projects/coding-school-platform/app/dist
            projects/coding-school-platform/app/input-quality-report.json
            projects/coding-school-platform/app/artifact-files.sha256
            projects/coding-school-platform/app/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Record artifact digest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: `%s`\nArtifact digest: `%s`\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  android-validation:
    name: Android Export Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: projects/coding-school-platform/app}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx expo export --platform android --output-dir dist-android
      - run: test -n "$(find dist-android -type f -print -quit)"

  ios-validation:
    name: iOS Export Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: projects/coding-school-platform/app}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx expo export --platform ios --output-dir dist-ios
      - run: test -n "$(find dist-ios -type f -print -quit)"

  gate-summary:
    name: Gate Summary (required for protection)
    if: always()
    needs: [quality, typecheck, domain, security, web-build-and-test, android-validation, ios-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every named gate
        env:
          QUALITY: ${{ needs.quality.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          DOMAIN: ${{ needs.domain.result }}
          SECURITY: ${{ needs.security.result }}
          WEB: ${{ needs.web-build-and-test.result }}
          ANDROID: ${{ needs.android-validation.result }}
          IOS: ${{ needs.ios-validation.result }}
        run: |
          failed=0
          for result in "$QUALITY" "$TYPECHECK" "$DOMAIN" "$SECURITY" "$WEB" "$ANDROID" "$IOS"; do
            test "$result" = success || failed=1
          done
          test "$failed" -eq 0 || { echo 'One or more required gates failed' >&2; exit 1; }
          echo 'All required quality gates passed'

  preview:
    name: Verified Vercel Preview
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/coding-school')
    needs: gate-summary
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/coding-school-vercel-preview.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source_event: ${{ github.event_name }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
