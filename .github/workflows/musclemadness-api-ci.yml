# CI Workflow — MuscleMadness API
# Install, Lint, Typecheck, Test, Build, Secret-Scan

name: MuscleMadness API CI

on:
  pull_request:
    paths:
      - 'projects/muscleMadness_API/**'
      - '.github/workflows/musclemadness-api-*.yml'
      - '.github/gitleaks.toml'
  push:
    branches: [main]
    paths:
      - 'projects/muscleMadness_API/**'
      - '.github/workflows/musclemadness-api-*.yml'
      - '.github/gitleaks.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-musclemadness-api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: '3.13'

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks (PR diff only)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_LOG_OPTS: --log-opts="--since=${{ github.event.pull_request.base.sha }}"
          GITLEAKS_EXIT_CODE: "1"
      - name: Run gitleaks (full history on protected branch)
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_EXIT_CODE: "1"

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/muscleMadness_API
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run pyright typecheck
        run: pyright muscleMadness_API
      - name: Run ruff lint
        run: ruff check muscleMadness_API

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/muscleMadness_API
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run tests
        run: python -m pytest -v
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: projects/muscleMadness_API/coverage
          if-no-files-found: ignore
          retention-days: 14