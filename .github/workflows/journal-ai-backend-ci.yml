# CI Workflow — Journal AI Backend (Django API)
# Poetry install, migrations, test, build

name: Journal AI Backend CI

on:
  pull_request:
    paths:
      - 'projects/journal-ai/legacy-src/persistent-gpt-api/**'
      - '.github/workflows/journal-ai-backend-*.yml'
      - '.github/gitleaks.toml'
  push:
    branches: [main]
    paths:
      - 'projects/journal-ai/legacy-src/persistent-gpt-api/**'
      - '.github/workflows/journal-ai-backend-*.yml'
      - '.github/gitleaks.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-journal-ai-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: '3.13'
  POETRY_VERSION: '1.8.3'

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks (PR diff only)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_LOG_OPTS: --log-opts="--since=${{ github.event.pull_request.base.sha }}"
          GITLEAKS_EXIT_CODE: "1"
      - name: Run gitleaks (full history on protected branch)
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_EXIT_CODE: "1"

  lint:
    name: Lint & Typecheck (Ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/journal-ai/legacy-src/persistent-gpt-api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: projects/journal-ai/legacy-src/persistent-gpt-api/requirements.txt
      - name: Install Poetry
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
      - name: Install dev dependencies (lint/typecheck)
        run: |
          pip install ruff mypy
      - name: Run ruff (lint)
        run: |
          ruff check .
      - name: Run mypy (typecheck)
        run: |
          mypy --ignore-missing-imports .

  test:
    name: Tests (pytest + Django)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/journal-ai/legacy-src/persistent-gpt-api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: projects/journal-ai/legacy-src/persistent-gpt-api/requirements.txt
      - name: Install Poetry
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
      - name: Install test dependencies
        run: |
          pip install pytest pytest-django
      - name: Run Django migrations
        env:
          DJANGO_SETTINGS_MODULE: Persistent_GPT_api.settings
        run: |
          python manage.py migrate --noinput
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: Persistent_GPT_api.settings
        run: |
          python -m pytest core/tests.py -v
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journal-ai-backend-coverage-${{ github.sha }}
          path: projects/journal-ai/legacy-src/persistent-gpt-api/coverage
          if-no-files-found: ignore
          retention-days: 14