name: Coding School Production Promotion

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful coding-school CI run ID whose exact artifact was preview-approved
        required: true
        type: string
      expected_source_sha:
        description: Full 40-character coding-school commit SHA approved in preview
        required: true
        type: string
      promote_production:
        description: I verified the preview and request protected production approval
        required: true
        default: false
        type: boolean
      dry_run:
        description: Verify provenance/OIDC configuration without deploying
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: coding-school-production
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate approved CI source
    if: inputs.promote_production == true && github.ref == 'refs/heads/coding-school'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      APP_PATH: projects/coding-school-platform/app
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: coding-school
          persist-credentials: false
      - name: Require source SHA to be current release branch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          case "$SOURCE_SHA" in [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) exit 1;; esac
          test "$(gh api "repos/$GH_REPOSITORY/commits/coding-school" --jq .sha)" = "$SOURCE_SHA" || { echo 'Source is not current coding-school' >&2; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.2.1
        with:
          name: coding-school-web
          path: ${{ env.APP_PATH }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify exact successful release-branch run and artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_EVENT: push
        working-directory: ${{ env.APP_PATH }}
        run: node ops/verify-source-artifact.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coding-school-production-candidate-${{ inputs.expected_source_sha }}
          path: |
            projects/coding-school-platform/app/dist
            projects/coding-school-platform/app/artifact-files.sha256
            projects/coding-school-platform/app/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Approval-gated Azure production
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: coding-school-production
      url: ${{ vars.AZURE_PRODUCTION_URL }}
    env:
      APP_PATH: projects/coding-school-platform/app
      PRODUCTION_URL: ${{ vars.AZURE_PRODUCTION_URL }}
      SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: coding-school
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.2.1
        with:
          name: coding-school-production-candidate-${{ needs.validate-source.outputs.source_sha }}
          path: ${{ env.APP_PATH }}
      - name: Verify candidate checksums and configuration
        working-directory: ${{ env.APP_PATH }}
        run: |
          sha256sum --check artifact-files.sha256
          test -n "$PRODUCTION_URL"
          case "$PRODUCTION_URL" in https://*) ;; *) exit 1;; esac
      - name: Obtain GitHub OIDC identity token for Azure Static Web Apps
        id: id-token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: return await core.getIDToken('api://AzureADTokenExchange')
          result-encoding: string
      - name: Dry-run release rehearsal
        if: inputs.dry_run == true
        env:
          OIDC_TOKEN: ${{ steps.id-token.outputs.result }}
        run: |
          test -n "$OIDC_TOKEN"
          echo 'Dry run passed: protected environment approved, exact artifact verified, OIDC token issued; deployment intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy prebuilt artifact with GitHub OIDC
        if: inputs.dry_run == false
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          action: upload
          app_location: projects/coding-school-platform/app/dist
          skip_app_build: true
          github_id_token: ${{ steps.id-token.outputs.result }}
      - name: Verify production classroom workflow
        if: inputs.dry_run == false
        env:
          DEPLOYMENT_METADATA: production-deployment-metadata.json
        working-directory: ${{ env.APP_PATH }}
        run: |
          printf '{"immutable_url":"%s","commit_sha":"%s","environment":"production"}\n' "$PRODUCTION_URL" "$SOURCE_SHA" > production-deployment-metadata.json
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node ops/browser-smoke.mjs
          printf 'Production: %s\nSource SHA: `%s`\n' "$PRODUCTION_URL" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"