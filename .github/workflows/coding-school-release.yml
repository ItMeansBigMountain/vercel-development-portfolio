name: Coding School CI and Vercel preview

on:
  pull_request:
    paths:
      - 'projects/coding-school-platform/**'
      - '.github/workflows/coding-school-*.yml'
  push:
    paths:
      - 'projects/coding-school-platform/**'
      - '.github/workflows/coding-school-*.yml'
  workflow_dispatch:
    inputs:
      promote_production:
        description: Deploy the tested web artifact to Azure after preview approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: coding-school-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  domain:
    name: Curriculum parity and role tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/coding-school-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q coding_school examples tests

  app:
    name: Four-role input smoke and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/coding-school-platform/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:web
      - run: npm run gate:inputs
      - run: npx expo export --platform android --output-dir dist-android
      - run: npx expo export --platform ios --output-dir dist-ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coding-school-exports-${{ github.sha }}
          path: |
            projects/coding-school-platform/app/dist
            projects/coding-school-platform/app/dist-android
            projects/coding-school-platform/app/dist-ios
            projects/coding-school-platform/app/input-quality-report.json
          if-no-files-found: error
          retention-days: 14

  preview:
    name: Secure Vercel preview
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [security, domain, app]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: coding-school-preview
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: projects/coding-school-platform/app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coding-school-exports-${{ github.sha }}
          path: projects/coding-school-platform/app
      - name: Validate environment-scoped configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            test -n "${!name:-}" || { echo "Missing $name in coding-school-preview" >&2; exit 1; }
          done
      - name: Deploy immutable preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx vercel@59.5.0 deploy dist --yes --token="$VERCEL_TOKEN")"
          case "$url" in https://*) ;; *) echo 'Vercel did not return an HTTPS preview URL' >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public preview
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}" >/dev/null
          npm ci --ignore-scripts
          SMOKE_URL="${{ steps.deploy.outputs.url }}" npm run smoke:web
          INPUT_GATE_URL="${{ steps.deploy.outputs.url }}" npm run gate:inputs

  production:
    name: Approval-gated Azure production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_production == true &&
      github.ref == 'refs/heads/main'
    needs: [security, domain, app, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: coding-school-production
      url: ${{ vars.AZURE_PRODUCTION_URL }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coding-school-exports-${{ github.sha }}
          path: projects/coding-school-platform/app
      - name: Validate OIDC and deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          AZURE_PRODUCTION_URL: ${{ vars.AZURE_PRODUCTION_URL }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_STATIC_WEB_APP_NAME AZURE_PRODUCTION_URL; do
            test -n "${!name:-}" || { echo "Missing $name in coding-school-production" >&2; exit 1; }
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Obtain an ephemeral Static Web Apps deployment token
        id: swa-token
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
        run: |
          token="$(az staticwebapp secrets list --name "$AZURE_STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          test -n "$token" || { echo 'Azure returned no deployment token' >&2; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: projects/coding-school-platform/app/dist
          skip_app_build: true
      - name: Verify production identity
        env:
          PRODUCTION_URL: ${{ vars.AZURE_PRODUCTION_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PRODUCTION_URL" > production.html
          grep -q 'Algorithm Academy' production.html
          printf 'Production: %s\nCommit: `%s`\n' "$PRODUCTION_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
