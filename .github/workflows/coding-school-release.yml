name: Coding School Production Promotion

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: Deploy the tested web artifact to Azure after preview approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  production:
    name: Approval-gated Azure production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_production == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: coding-school-production
      url: ${{ vars.AZURE_PRODUCTION_URL }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coding-school-web-${{ github.sha }}
          path: projects/coding-school-platform/app
      - name: Validate web build artifact
        run: |
          test -d "projects/coding-school-platform/app/dist" || { echo "No build output found in artifact at projects/coding-school-platform/app/dist" >&2; exit 1; }
          echo "Build artifact verified: $(du -sh projects/coding-school-platform/app/dist)"
      - name: Validate OIDC and deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          AZURE_PRODUCTION_URL: ${{ vars.AZURE_PRODUCTION_URL }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_STATIC_WEB_APP_NAME AZURE_PRODUCTION_URL; do
            test -n "${!name:-}" || { echo "Missing $name in coding-school-production" >&2; exit 1; }
          done
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Obtain an ephemeral Static Web Apps deployment token
        id: swa-token
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
        run: |
          token="$(az staticwebapp secrets list --name "$AZURE_STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          test -n "$token" || { echo 'Azure returned no deployment token' >&2; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: projects/coding-school-platform/app/dist
          skip_app_build: true
      - name: Verify production identity
        env:
          PRODUCTION_URL: ${{ vars.AZURE_PRODUCTION_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PRODUCTION_URL" > production.html
          grep -q 'Algorithm Academy' production.html
          printf 'Production: %s\nCommit: `%s`\n' "$PRODUCTION_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"