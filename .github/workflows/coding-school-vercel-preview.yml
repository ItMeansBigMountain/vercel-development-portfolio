name: Coding School Vercel Preview

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_event:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: coding-school-vercel-preview-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified artifact to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: coding-school-preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      APP_PATH: projects/coding-school-platform/app
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_EVENT: ${{ inputs.source_event }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: '59.5.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: coding-school
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/coding-school-platform/app/package-lock.json
      - name: Validate trusted source and configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SOURCE_RUN_ID SOURCE_SHA; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done
          test "$VERCEL_PROJECT_ID" = prj_2RTTGwmqepGM9TMkyX2iXX9jbrNt
          test "$VERCEL_ORG_ID" = team_9IP8D1xXFQSrBMZrMjRnl9sD
      - name: Download artifact from exact successful CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.2.1
        with:
          name: coding-school-web
          path: ${{ env.APP_PATH }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify source manifest and artifact record
        env:
          ALLOW_IN_PROGRESS: 'true'
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        working-directory: ${{ env.APP_PATH }}
        run: node ops/verify-source-artifact.mjs
      - name: Install locked browser dependency
        working-directory: ${{ env.APP_PATH }}
        run: npm ci --ignore-scripts
      - name: Prepare static deployment without executing source code
        working-directory: ${{ env.APP_PATH }}
        run: node ops/prepare-vercel-deployment.mjs
      - name: Deploy immutable preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ env.APP_PATH }}
        run: |
          url="$(npx --yes vercel@"$VERCEL_CLI_VERSION" deploy .vercel-deploy --yes --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --meta githubCommitSha="$SOURCE_SHA" --meta githubCommitRepo="${{ github.repository }}")"
          case "$url" in https://*) ;; *) echo 'Vercel did not return HTTPS URL' >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify Vercel API identity and emit metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IMMUTABLE_URL: ${{ steps.deploy.outputs.url }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: ${{ env.APP_PATH }}
        run: node ops/verify-vercel-deployment.mjs
      - name: Run strict desktop and mobile browser checks
        env:
          DEPLOYMENT_METADATA: deployment-metadata.json
        working-directory: ${{ env.APP_PATH }}
        run: |
          npx playwright install --with-deps chromium
          node ops/browser-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coding-school-preview-evidence-${{ env.SOURCE_SHA }}
          path: |
            projects/coding-school-platform/app/deployment-metadata.json
            projects/coding-school-platform/app/browser-smoke-results.json
          if-no-files-found: error
          retention-days: 90